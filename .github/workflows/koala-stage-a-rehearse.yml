name: Koala Stage A Rehearsal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only by default; execute requires separate authorization and exact confirmation. tail-probe runs the identical tail path at probe scale and can never qualify anything.
        required: true
        default: plan
        type: choice
        options:
          - plan
          - calibrate
          - ablate
          - tail-probe
          - execute
      run_id:
        description: Unique lowercase run ID (4-32 characters)
        required: true
        default: rehearsal-plan
        type: string
      confirmation:
        description: Exact run-specific confirmation printed by plan mode; required only for execute
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: koala-stage-a-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate harness contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate repository
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "koala-optics/muninndb"

      - name: Check out workflow ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Run static and contract checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/koala_stage_a_rehearsal.py scripts/tests/test_koala_stage_a_rehearsal.py
          python3 scripts/tests/test_koala_stage_a_rehearsal.py
          git diff --check

      - name: Render non-mutating plan
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/koala-stage-a
          if test "$MODE" = "calibrate"; then
            plan_mode=calibrate
            record_count=25000
            payload_bytes=1000
          elif test "$MODE" = "ablate"; then
            plan_mode=ablate
            record_count=25000
            payload_bytes=1000
          elif test "$MODE" = "tail-probe"; then
            plan_mode=tail-probe
            record_count=2000
            payload_bytes=4000
          else
            plan_mode=execute
            record_count=502385
            payload_bytes=4000
          fi
          python3 scripts/koala_stage_a_rehearsal.py \
            --dry-run --plan-mode "$plan_mode" --run-id "$RUN_ID" \
            --record-count "$record_count" --payload-bytes "$payload_bytes" --json \
            > /tmp/koala-stage-a/plan.json

      - name: Upload plan receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koala-stage-a-${{ inputs.run_id }}-plan
          path: /tmp/koala-stage-a/plan.json
          if-no-files-found: error
          retention-days: 30

  execute:
    name: Execute disposable Fly rehearsal
    if: inputs.mode != 'plan'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: koala-stage-a-rehearsal
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out workflow ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned flyctl
        shell: bash
        env:
          FLYCTL_VERSION: v0.4.52
          FLYCTL_SHA256: f1d02cd67b328b69649b68648de6d67b18a0bd0acc862fc0a809862ee5e0e919
        run: |
          set -euo pipefail
          archive="flyctl_${FLYCTL_VERSION#v}_Linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/superfly/flyctl/releases/download/${FLYCTL_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          printf '%s  %s\n' "$FLYCTL_SHA256" "/tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /usr/local/bin flyctl
          flyctl version

      - name: Install pinned crane
        if: inputs.mode == 'execute' || inputs.mode == 'tail-probe'
        shell: bash
        env:
          CRANE_VERSION: v0.21.7
          CRANE_SHA256: 1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230
        run: |
          set -euo pipefail
          archive="go-containerregistry_Linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          printf '%s  %s\n' "$CRANE_SHA256" "/tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /usr/local/bin crane
          crane version

      - name: Authenticate candidate source and Fly registries
        if: inputs.mode == 'execute' || inputs.mode == 'tail-probe'
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | crane auth login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          printf '%s' "$FLY_API_TOKEN" | crane auth login registry.fly.io --username x --password-stdin

      - name: Validate authorized repository and source ref
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          AUTHORIZED_SHA: ${{ vars.AUTHORIZED_STAGE_A_SHA }}
          AUTHORIZED_REF: ${{ vars.AUTHORIZED_STAGE_A_REF }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "koala-optics/muninndb"
          test -n "$AUTHORIZED_SHA"
          test -n "$AUTHORIZED_REF"
          test "$DISPATCH_SHA" = "$AUTHORIZED_SHA"
          test "$DISPATCH_REF" = "$AUTHORIZED_REF"
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_SHA"

      - name: Validate exact execute confirmation
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          required="$(python3 scripts/koala_stage_a_rehearsal.py --dry-run --run-id "$RUN_ID" --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["confirmation_required_for_execute"])')"
          test -n "$CONFIRMATION"
          test "$CONFIRMATION" = "$required"

      - name: Run disposable Stage A rehearsal
        id: rehearsal
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          MODE: ${{ inputs.mode }}
        run: |
          set +e
          mkdir -p /tmp/koala-stage-a
          printf '2\n' > /tmp/koala-stage-a/exit-code
          if test "$MODE" = "calibrate"; then
            deadline=120m
            mode_flag=--calibrate
          elif test "$MODE" = "ablate"; then
            deadline=180m
            mode_flag=--ablate
          elif test "$MODE" = "tail-probe"; then
            deadline=90m
            mode_flag=--tail-probe
          else
            deadline=300m
            mode_flag=--execute
          fi
          timeout --signal=TERM --kill-after=10m "$deadline" \
            python3 scripts/koala_stage_a_rehearsal.py \
              "$mode_flag" --run-id "$RUN_ID" --confirm "$CONFIRMATION" \
              --receipt /tmp/koala-stage-a/receipt.json
          code=$?
          printf '%s\n' "$code" > /tmp/koala-stage-a/exit-code
          printf 'exit_code=%s\n' "$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Clean up exact run-owned resources
        if: always()
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set +e
          python3 scripts/koala_stage_a_rehearsal.py \
            --cleanup-only --run-id "$RUN_ID" --confirm "$CONFIRMATION" \
            --receipt /tmp/koala-stage-a/cleanup.json
          cleanup_code=$?
          printf '%s\n' "$cleanup_code" > /tmp/koala-stage-a/cleanup-exit-code
          exit 0

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koala-stage-a-${{ inputs.run_id }}-evidence
          path: |
            /tmp/koala-stage-a/receipt.json
            /tmp/koala-stage-a/receipt.json.sha256
            /tmp/koala-stage-a/cleanup.json
            /tmp/koala-stage-a/cleanup.json.sha256
            /tmp/koala-stage-a/exit-code
            /tmp/koala-stage-a/cleanup-exit-code
          if-no-files-found: error
          retention-days: 30

      - name: Enforce rehearsal verdict
        if: always()
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test -f /tmp/koala-stage-a/exit-code
          test -f /tmp/koala-stage-a/cleanup-exit-code
          test "$(cat /tmp/koala-stage-a/exit-code)" = "0"
          test "$(cat /tmp/koala-stage-a/cleanup-exit-code)" = "0"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads(Path("/tmp/koala-stage-a/receipt.json").read_text())
          cleanup = json.loads(Path("/tmp/koala-stage-a/cleanup.json").read_text())
          mode = os.environ["MODE"]
          # The accepted status is chosen by the DISPATCHED mode and compared by equality,
          # so a probe receipt can never satisfy a qualification run and a qualification
          # pass can never be produced by a probe. The receipt must additionally declare
          # the mode it ran as, so the two cannot be confused even if a status were.
          expected_status = "TAIL_PROBE_PASS" if mode == "tail-probe" else "PASSED"
          expected_mode = "tail_probe" if mode == "tail-probe" else mode
          if receipt.get("status") != expected_status:
              raise SystemExit("rehearsal receipt did not pass")
          if receipt.get("measurements", {}).get("mode") != expected_mode:
              raise SystemExit("rehearsal receipt mode does not match the dispatched mode")
          if cleanup.get("status") != "PASSED" or cleanup.get("orphans"):
              raise SystemExit("independent cleanup did not pass")
          PY
